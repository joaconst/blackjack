<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mesa</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      // La tragamonedas 3×3 se reemplazó por Táctica y Pulso: los enlaces
      // viejos caen acá y siguen de largo a la máquina que estaba elegida.
      var prefs = {};
      try {
        prefs = JSON.parse(localStorage.getItem('blackjack.prefs.v1') || '{}') || {};
      } catch (e) {}
      var target = prefs.game === 'pulso' ? 'pulso.html' : 'tactica.html';
      location.replace(target);
    })();
  </script>
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f6f5f0;
      color: #2b2f2a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
    }
    a { color: inherit; }
  </style>
</head>
<body>
  <p>Te estamos llevando a la máquina. Si no pasa nada, <a href="tactica.html">tocá acá</a>.</p>
</body>
</html>
